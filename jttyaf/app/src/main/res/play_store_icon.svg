<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <!-- JTTYAF: the *af family mark in teleprinter-phosphor green. The four JTTY tones
       (a 4-GFSK symbol staircase) replace FT8AF's single beam disc. -->
  <defs>
    <!-- Background: deep-navy radial gradient -->
    <radialGradient id="bg-grad" cx="54" cy="45" r="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A2238"/>
      <stop offset="0.55" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#04070E"/>
    </radialGradient>
    <!-- Background: emerald center halo -->
    <radialGradient id="halo-grad" cx="54" cy="57" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.2"/>
      <stop offset="0.7" stop-color="#34D399" stop-opacity="0.039"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <!-- Foreground: tone bar gradient -->
    <linearGradient id="tone-grad" x1="0" y1="50" x2="0" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <!-- Circular adaptive-icon mask -->
    <clipPath id="circle-mask">
      <circle cx="54" cy="54" r="50"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circle-mask)">
    <!-- ===== BACKGROUND LAYER ===== -->
    <rect x="0" y="0" width="108" height="108" fill="url(#bg-grad)"/>
    <circle cx="54" cy="57" r="38" fill="url(#halo-grad)"/>

    <!-- ===== FOREGROUND LAYER ===== -->
    <!-- Range rings -->
    <circle cx="54" cy="57" r="30" fill="none" stroke="#A0B6DC" stroke-opacity="0.2" stroke-width="0.6"/>
    <circle cx="54" cy="57" r="21" fill="none" stroke="#A0B6DC" stroke-opacity="0.2" stroke-width="0.6"/>

    <!-- Signal arcs (top half, outer to inner) -->
    <path d="M22,57 A32,32 0 0,1 86,57" fill="none" stroke="#34D399" stroke-opacity="0.333" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M30,57 A24,24 0 0,1 78,57" fill="none" stroke="#34D399" stroke-opacity="0.6" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M38,57 A16,16 0 0,1 70,57" fill="none" stroke="#6EE7B7" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Four JTTY tones: 4-GFSK symbol staircase (tones 0,2,3,1) -->
    <rect x="44" y="59.8" width="3.6" height="6.2" rx="1.2" fill="url(#tone-grad)"/>
    <rect x="49.4" y="54.8" width="3.6" height="11.2" rx="1.2" fill="url(#tone-grad)"/>
    <rect x="54.8" y="51.8" width="3.6" height="14.2" rx="1.2" fill="url(#tone-grad)"/>
    <rect x="60.2" y="57.3" width="3.6" height="8.7" rx="1.2" fill="url(#tone-grad)"/>
    <!-- Baseline -->
    <path d="M42,67.2 L66,67.2" fill="none" stroke="#34D399" stroke-opacity="0.6" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Signal sparks -->
    <circle cx="22" cy="57" r="0.6" fill="#A7F3D0" fill-opacity="0.502"/>
    <circle cx="86" cy="57" r="0.6" fill="#A7F3D0" fill-opacity="0.502"/>
    <circle cx="30" cy="57" r="0.6" fill="#A7F3D0" fill-opacity="0.502"/>
    <circle cx="78" cy="57" r="0.6" fill="#A7F3D0" fill-opacity="0.502"/>
  </g>
</svg>
