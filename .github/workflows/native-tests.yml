name: Native JTTY tests

# Gates on the clean-room JTTY codec host tests (cpp/jtty_lib +
# cpp/jttyaf_glue/test_jtty_*.c): source-coding golden vectors, CRC/TBCC round
# trips and sensitivity, modem end-to-end decodes, and (when the WSJT-X sample
# recording is present) the official-sample decode. The build is host-only C11
# (seconds), so it runs on every PR to dev/staging/main without a path filter —
# keeping it a reliable required status check.

on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [main, staging, dev]

# A new push to the same PR/branch cancels the prior in-flight run.
concurrency:
  group: native-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jtty-host-tests:
    name: JTTY codec host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show compiler version
        run: gcc --version

      - name: Build & run JTTY host test suites
        run: bash jttyaf/app/src/main/cpp/jttyaf_glue/run_jtty_host_tests.sh
